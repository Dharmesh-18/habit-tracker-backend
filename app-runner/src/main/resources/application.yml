server:
  port: 8080

spring:
  application:
    name: habit-tracker-backend
  profiles:
    active: dev

application:
  jwt:
    # 256-bit key for dev (Production me environment variable se aayegi)
    secret-key: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    access-token-expiration-ms: 86400000 # 1 day

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Day 2 me hum ise Neon PostgreSQL se connect karenge
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/habit_tracker_dev}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration